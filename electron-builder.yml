appId: com.agentforge.desktop
productName: AgentForge
copyright: Copyright © 2026 AgentForge Contributors

publish:
  provider: github
  owner: thanhtuyen662002
  repo: Agent-Forge

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - dist-electron/**
  - package.json

asar: true
asarUnpack:
  - node_modules/better-sqlite3/**

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
