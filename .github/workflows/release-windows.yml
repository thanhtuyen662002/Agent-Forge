name: Release Windows Desktop

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish as DRAFT (e.g. v0.1.0)'
        required: true
        type: string

concurrency:
  group: agentforge-release-windows
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Stage Windows DRAFT Release (windows-latest, Node 22.x)
    runs-on: windows-latest
    steps:
      - name: Verify release trigger authorization
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -ne 'workflow_dispatch') {
            Write-Error "Release workflow must ONLY be triggered via manual workflow_dispatch."
            exit 1
          }
          $tag = '${{ inputs.release_tag }}'.Trim()
          if (-not $tag -or $tag -notmatch '^v?[0-9]+\.[0-9]+\.[0-9]+') {
            Write-Error "Invalid release tag format: '$tag'. Expected format: 'vX.Y.Z' or 'X.Y.Z'."
            exit 1
          }
          Write-Host "Authorized workflow_dispatch release trigger for tag: $tag"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source commit is on main branch
        shell: bash
        run: |
          echo "=== Release Source Verification ==="
          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          CURRENT_SHA="$(git rev-parse HEAD)"
          echo "Origin Main SHA: $MAIN_SHA"
          echo "Current HEAD SHA: $CURRENT_SHA"
          if [ "$CURRENT_SHA" != "$MAIN_SHA" ]; then
            echo "ERROR: Release source commit ($CURRENT_SHA) does not match origin/main ($MAIN_SHA)."
            echo "Releases must be built strictly from verified main branch."
            exit 1
          fi
          echo "Main branch source verification: PASS"

      - name: Verify version and tag consistency (Fail-Closed)
        shell: pwsh
        run: |
          $pkgJson = Get-Content -Path "package.json" -Raw | ConvertFrom-Json
          $pkgVersion = $pkgJson.version.Trim()
          $rawTag = '${{ inputs.release_tag }}'.Trim()
          $normalizedTag = $rawTag.TrimStart('v')

          Write-Host "Package version: $pkgVersion"
          Write-Host "Input release tag: $rawTag (normalized: $normalizedTag)"

          if ($pkgVersion -ne $normalizedTag) {
            Write-Error "VERSION MISMATCH FAIL-CLOSED: package.json version ($pkgVersion) does not match release tag ($rawTag)."
            exit 1
          }
          Write-Host "Version/tag consistency check: PASS"

      - name: Verify release collision guards (Fail-Closed)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $rawTag = '${{ inputs.release_tag }}'.Trim()
          $normalizedTag = $rawTag.TrimStart('v')
          $vPrefixedTag = "v$normalizedTag"

          Write-Host "Checking for existing remote tags ($rawTag, $vPrefixedTag, $normalizedTag)..."
          $remoteTags = git ls-remote --tags origin
          if ($remoteTags -match "refs/tags/$rawTag`$" -or $remoteTags -match "refs/tags/$vPrefixedTag`$" -or $remoteTags -match "refs/tags/$normalizedTag`$") {
            Write-Error "RELEASE COLLISION GUARD FAIL-CLOSED: Tag already exists on remote origin!"
            exit 1
          }

          Write-Host "Checking for existing GitHub releases..."
          $releasesJson = gh api /repos/${{ github.repository }}/releases | ConvertFrom-Json
          $matching = $releasesJson | Where-Object { $_.tag_name -eq $rawTag -or $_.tag_name -eq $vPrefixedTag -or $_.tag_name -eq $normalizedTag }
          if ($matching) {
            Write-Error "RELEASE COLLISION GUARD FAIL-CLOSED: GitHub release already exists for tag ($rawTag)!"
            exit 1
          }
          Write-Host "Release collision check: PASS (No pre-existing tag or release)"

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build application
        run: npm run build

      - name: Verify generated relative asset base
        shell: pwsh
        run: |
          $html = Get-Content -Path "dist\index.html" -Raw
          if ($html -match 'src="/assets/' -or $html -match 'href="/assets/') {
            Write-Error "dist\index.html contains root-absolute asset paths (/assets/). Must use relative paths."
            exit 1
          }
          Write-Host "dist\index.html relative asset path check: PASS"

      - name: Package production Windows installer ONCE (No Publish)
        run: npm run package:win

      - name: Stage and freeze exact release assets
        shell: pwsh
        run: |
          $pkgJson = Get-Content -Path "package.json" -Raw | ConvertFrom-Json
          $ver = $pkgJson.version.Trim()
          $sha = (git rev-parse HEAD).Trim()
          powershell -ExecutionPolicy Bypass -File scripts/prepare-release-assets-win.ps1 `
            -ExpectedVersion $ver `
            -ReleaseTag "${{ inputs.release_tag }}" `
            -SourceSha $sha `
            -ReleaseDir "release" `
            -StagingDir "release\publish-assets"

      - name: Run packaged process runtime smoke
        shell: pwsh
        run: |
          npm run smoke:packaged:win -- -Headless

      - name: Run installed update integration test
        shell: pwsh
        run: |
          npm run test:installed:win -- -Headless

      - name: Run real production installed smoke using exact staged installer
        shell: pwsh
        run: |
          $stagedMeta = Get-Content -Path "release\publish-assets\release-metadata.txt" -Raw
          if ($stagedMeta -notmatch "PUBLISHED_INSTALLER_FILENAME=([^\r\n]+)") {
            Write-Error "Failed to parse PUBLISHED_INSTALLER_FILENAME from release-metadata.txt"
            exit 1
          }
          $stagedInstallerName = $Matches[1].Trim()
          $stagedInstallerPath = "release\publish-assets\$stagedInstallerName"

          Write-Host "Executing production installed smoke on exact staged installer: $stagedInstallerPath"
          powershell -ExecutionPolicy Bypass -File scripts/smoke-installed-production-win.ps1 `
            -InstallerPath $stagedInstallerPath `
            -Headless

      - name: Run demo RC verification on exact staged installer
        shell: pwsh
        run: |
          $stagedMeta = Get-Content -Path "release\publish-assets\release-metadata.txt" -Raw
          if ($stagedMeta -notmatch "PUBLISHED_INSTALLER_FILENAME=([^\r\n]+)") {
            Write-Error "Failed to parse PUBLISHED_INSTALLER_FILENAME from release-metadata.txt"
            exit 1
          }
          $stagedInstallerName = $Matches[1].Trim()
          $stagedInstallerPath = "release\publish-assets\$stagedInstallerName"

          Write-Host "Executing RC verification on exact staged installer: $stagedInstallerPath"
          powershell -ExecutionPolicy Bypass -File scripts/verify-demo-rc-win.ps1 `
            -InstallerPath $stagedInstallerPath `
            -ReceiptOutput "release\publish-assets\demo-rc-receipt.txt"

      - name: Verify Staged Assets Integrity Before GitHub Mutation
        shell: pwsh
        run: |
          $stagedDir = "release\publish-assets"
          $metadataPath = Join-Path $stagedDir "release-metadata.txt"
          $receiptPath = Join-Path $stagedDir "demo-rc-receipt.txt"
          $latestYmlPath = Join-Path $stagedDir "latest.yml"

          if (-not (Test-Path $metadataPath)) { Write-Error "Missing $metadataPath"; exit 1 }
          if (-not (Test-Path $receiptPath)) { Write-Error "Missing $receiptPath"; exit 1 }
          if (-not (Test-Path $latestYmlPath)) { Write-Error "Missing $latestYmlPath"; exit 1 }

          $receiptContent = Get-Content -Path $receiptPath -Raw
          if ($receiptContent -notmatch "RC_VERIFICATION_STATUS=PASS") {
            Write-Error "RC verification failed or receipt does not indicate PASS!"
            exit 1
          }

          Write-Host "All release gates passed. Ready to create DRAFT release from frozen staged assets."

      - name: Create GitHub DRAFT Release From Frozen Assets Only
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ inputs.release_tag }}'.Trim()
          $sha = (git rev-parse HEAD).Trim()
          $stagedDir = "release\publish-assets"
          $metadataPath = Join-Path $stagedDir "release-metadata.txt"

          Write-Host "=== Creating GitHub DRAFT Release ==="
          Write-Host "Tag:    $tag"
          Write-Host "Target: $sha"
          Write-Host "Draft:  true (Explicit draft release policy)"

          $assets = @(Get-ChildItem -Path $stagedDir -File | ForEach-Object { $_.FullName })
          Write-Host "Assets to upload:"
          foreach ($a in $assets) {
            Write-Host "  - $(Split-Path -Leaf $a)"
          }

          gh release create $tag $assets `
            --target $sha `
            --draft `
            --title "AgentForge $tag" `
            --notes-file $metadataPath

          Write-Host "GitHub DRAFT release created successfully."

      - name: Verify Published DRAFT Release (Post-Creation Verification)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ inputs.release_tag }}'.Trim()
          $sha = (git rev-parse HEAD).Trim()

          Write-Host "=== Verifying Created DRAFT Release via GitHub API ==="
          $releaseInfo = gh release view $tag --json isDraft,isPrerelease,tagName,targetCommitish,assets | ConvertFrom-Json

          if ($releaseInfo.isDraft -ne $true) {
            Write-Error "CRITICAL SECURITY BREACH: Release is NOT marked as draft!"
            exit 1
          }

          if ($releaseInfo.tagName -ne $tag) {
            Write-Error "Release tag mismatch: expected $tag, got $($releaseInfo.tagName)"
            exit 1
          }

          if ($releaseInfo.targetCommitish -ne $sha) {
            Write-Error "Release target SHA mismatch: expected $sha, got $($releaseInfo.targetCommitish)"
            exit 1
          }

          $assetNames = @($releaseInfo.assets | ForEach-Object { $_.name })
          Write-Host "Uploaded Release Assets in Draft: $($assetNames -join ', ')"

          $requiredPatterns = @('\.exe$', '\.blockmap$', '^latest\.yml$', '^release-metadata\.txt$', '^demo-rc-receipt\.txt$')
          foreach ($pat in $requiredPatterns) {
            $found = $assetNames | Where-Object { $_ -match $pat }
            if (-not $found) {
              Write-Error "Missing required asset matching pattern '$pat' in draft release!"
              exit 1
            }
          }

          Write-Host "Post-creation draft verification: PASS (Draft=true, Target=$sha, All assets present)"

      - name: Upload Release Step Summary
        if: always()
        shell: bash
        run: |
          echo "### AgentForge Windows Release Summary (DRAFT ONLY)" >> $GITHUB_STEP_SUMMARY
          echo "- **Exact Published Commit**: \`$(git rev-parse HEAD)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag**: \`${{ inputs.release_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release State**: \`DRAFT (Awaiting Owner Review & Publication Approval)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Publish Status**: \`${{ job.status }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -f "release/publish-assets/release-metadata.txt" ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat release/publish-assets/release-metadata.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "release/publish-assets/demo-rc-receipt.txt" ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat release/publish-assets/demo-rc-receipt.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
