name: AgentForge Fast PR Validation

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: agentforge-fast-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    name: Fast deterministic gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact PR head
        shell: bash
        run: |
          EXPECTED_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Diff hygiene
        if: github.event_name == 'pull_request'
        run: git diff --check ${{ github.event.pull_request.base.sha }}...HEAD
