name: AgentForge Fast PR Validation

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: agentforge-fast-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    name: Fast deterministic gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run deterministic tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Diff hygiene
        if: github.event_name == 'pull_request'
        run: git diff --check ${{ github.event.pull_request.base.sha }}...HEAD
