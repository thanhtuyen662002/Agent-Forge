name: AgentForge Autonomous Contract Validation

on:
  issues:
    types:
      - opened
      - edited
      - reopened
  # Use pull_request_target so the validator is executed from trusted base
  # source. The workflow never checks out or executes the pull-request head.
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    name: Validate autonomous contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'

      - name: Validate event contract
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/autonomy-contract-validator.cjs
