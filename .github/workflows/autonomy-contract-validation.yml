name: AgentForge Autonomous Contract Validation

on:
  issues:
    types:
      - opened
      - edited
      - reopened
  # Use pull_request_target so the validator is executed from trusted base
  # source. The workflow never checks out or executes the pull-request head.
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    name: Validate autonomous contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 22.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.x'

      - name: Validate event contract
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/autonomy-contract-validator.cjs
