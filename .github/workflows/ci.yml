name: AgentForge CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: agentforge-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
        node-version:
          - '20.x'

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show build identity
        shell: bash
        run: |
          echo "=== CI Build Identity ==="
          echo "Event Name: ${{ github.event_name }}"
          echo "Git Reference: ${{ github.ref }}"
          echo "Exact Tested HEAD SHA: $(git rev-parse HEAD)"
          echo "Working Tree Status:"
          git status --short

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build application
        run: npm run build

      - name: Validate PR diff hygiene
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          echo "Validating whitespace diff against base: ${{ github.event.pull_request.base.sha }}"
          git diff --check ${{ github.event.pull_request.base.sha }}...HEAD

      - name: Write Step Summary
        if: always()
        shell: bash
        run: |
          echo "### AgentForge CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner OS**: \`${{ matrix.os }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Node Version**: \`${{ matrix.node-version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Exact Tested Commit**: \`$(git rev-parse HEAD)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Event**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Result**: \`${{ job.status }}\`" >> $GITHUB_STEP_SUMMARY
