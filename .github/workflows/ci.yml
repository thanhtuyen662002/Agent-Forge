name: AgentForge CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: agentforge-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
        node-version:
          - '22.x'

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Show and verify build identity
        shell: bash
        run: |
          echo "=== CI Build Identity ==="
          echo "Event Name: ${{ github.event_name }}"
          echo "Git Reference: ${{ github.ref }}"
          EXPECTED_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Expected Source SHA: $EXPECTED_SHA"
          echo "Actual Tested SHA:   $ACTUAL_SHA"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: Exact-head identity mismatch. Expected $EXPECTED_SHA but got $ACTUAL_SHA"
            exit 1
          fi
          echo "Working Tree Status:"
          git status --short

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build application
        run: npm run build

      - name: Validate PR diff hygiene
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          echo "Validating whitespace diff against base: ${{ github.event.pull_request.base.sha }}"
          git diff --check ${{ github.event.pull_request.base.sha }}...HEAD

      - name: Write Step Summary
        if: always()
        shell: bash
        run: |
          echo "### AgentForge CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner OS**: \`${{ matrix.os }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Node Version**: \`${{ matrix.node-version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Exact Tested Commit**: \`$(git rev-parse HEAD)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Event**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Result**: \`${{ job.status }}\`" >> $GITHUB_STEP_SUMMARY

  package-windows:
    name: Package Windows (windows-latest, Node 22.x)
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Show and verify build identity
        shell: bash
        run: |
          echo "=== CI Package Build Identity ==="
          echo "Event Name: ${{ github.event_name }}"
          echo "Git Reference: ${{ github.ref }}"
          EXPECTED_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Expected Source SHA: $EXPECTED_SHA"
          echo "Actual Tested SHA:   $ACTUAL_SHA"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: Exact-head identity mismatch. Expected $EXPECTED_SHA but got $ACTUAL_SHA"
            exit 1
          fi
          echo "Working Tree Status:"
          git status --short

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build application
        run: npm run build

      - name: Verify generated relative asset base
        shell: pwsh
        run: |
          $html = Get-Content -Path "dist\index.html" -Raw
          if ($html -match 'src="/assets/' -or $html -match 'href="/assets/') {
            Write-Error "dist\index.html contains root-absolute asset paths (/assets/). Must use relative paths."
            exit 1
          }
          Write-Host "dist\index.html relative asset path check: PASS"

      - name: Generate unpacked Windows directory
        run: npm run package:win:dir

      - name: Run packaged process runtime smoke
        shell: pwsh
        run: |
          npm run smoke:packaged:win -- -Headless

      - name: Generate Windows NSIS installer
        run: npm run package:win

      - name: Run real Windows installed application update integration test
        shell: pwsh
        run: |
          npm run test:installed:win -- -Headless

      - name: Verify installer and generate metadata
        shell: pwsh
        run: |
          $installerPath = "release\AgentForge Setup 0.1.0.exe"
          if (-not (Test-Path $installerPath)) {
            Write-Error "Installer executable not found at $installerPath"
            exit 1
          }

          $hash = (Get-FileHash -Path $installerPath -Algorithm SHA256).Hash
          $size = (Get-Item $installerPath).Length
          $sha = (git rev-parse HEAD).Trim()
          $sig = Get-AuthenticodeSignature -FilePath $installerPath
          $sigStatus = $sig.Status.ToString()
          $codeSigned = if ($sig.Status -eq "Valid") { "YES" } else { "NO" }

          Write-Host "=== Windows Installer Verification ==="
          Write-Host "Installer: $installerPath"
          Write-Host "Size: $size bytes"
          Write-Host "SHA256: $hash"
          Write-Host "Authenticode Status: $sigStatus"
          Write-Host "Code Signed: $codeSigned"
          Write-Host "Source SHA: $sha"

          $metadataContent = @"
          SOURCE_SHA=$sha
          INSTALLER_FILENAME=AgentForge Setup 0.1.0.exe
          INSTALLER_SIZE_BYTES=$size
          INSTALLER_SHA256=$hash
          AUTHENTICODE_STATUS=$sigStatus
          CODE_SIGNED=$codeSigned
          BUILD_OS=windows-latest
          APP_VERSION=0.1.0
          "@

          Set-Content -Path "release\installer-metadata.txt" -Value $metadataContent

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentforge-windows-installer-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            release/AgentForge Setup 0.1.0.exe
            release/installer-metadata.txt
          if-no-files-found: error
          retention-days: 7

      - name: Write Packaging Step Summary
        if: always()
        shell: bash
        run: |
          echo "### AgentForge Windows Packaging Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Exact Tested Commit**: \`$(git rev-parse HEAD)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Packaging Status**: \`${{ job.status }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -f "release/installer-metadata.txt" ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat release/installer-metadata.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
