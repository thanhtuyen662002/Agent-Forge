name: AgentForge CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: agentforge-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Classify PR scope
    runs-on: ubuntu-latest
    outputs:
      package_required: ${{ steps.paths.outputs.package_required }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify exact-head paths
        id: paths
        shell: bash
        run: |
          EXPECTED_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          GITHUB_EVENT_NAME="${{ github.event_name }}" node scripts/ci-change-classifier.cjs \
            "${{ github.event.pull_request.base.sha }}" "$EXPECTED_SHA" >> "$GITHUB_OUTPUT"

  windows-test-shards:
    name: Windows test shard ${{ matrix.shard }}/4
    needs: classify
    if: needs.classify.outputs.package_required == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify shard source identity
        shell: bash
        run: |
          EXPECTED_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Each machine owns its fixtures. Keep one worker and the existing
      # parent/worker output sanitizers within each complete-suite shard.
      - name: Run complete suite shard
        env:
          AGENTFORGE_TEST_SINGLE_RUN: '1'
          AGENTFORGE_TEST_FILES: ''
          AGENTFORGE_TEST_PHASE: ''
        run: npm test -- --shard=${{ matrix.shard }}/4

      - name: Write shard summary
        if: always()
        shell: bash
        run: |
          echo "### Windows full-suite shard ${{ matrix.shard }}/4" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Validate (${{ matrix.os }}, Node ${{ matrix.node-version }})
    needs: classify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        node-version:
          - '22.x'

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Show and verify build identity
        shell: bash
        run: |
          echo "=== CI Build Identity ==="
          echo "Event Name: ${{ github.event_name }}"
          echo "Git Reference: ${{ github.ref }}"
          EXPECTED_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Expected Source SHA: $EXPECTED_SHA"
          echo "Actual Tested SHA:   $ACTUAL_SHA"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: Exact-head identity mismatch. Expected $EXPECTED_SHA but got $ACTUAL_SHA"
            exit 1
          fi
          echo "Working Tree Status:"
          git status --short

      - name: Setup Node.js ${{ matrix.node-version }}
        if: needs.classify.outputs.package_required == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        if: needs.classify.outputs.package_required == 'true'
        run: npm ci

      - name: Run test suite (Ubuntu)
        if: needs.classify.outputs.package_required == 'true' && runner.os != 'Windows'
        run: npm test

      - name: Build application
        if: needs.classify.outputs.package_required == 'true'
        run: npm run build

      - name: Validate PR diff hygiene
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          echo "Validating whitespace diff against base: ${{ github.event.pull_request.base.sha }}"
          git diff --check ${{ github.event.pull_request.base.sha }}...HEAD

      - name: Write Step Summary
        if: always()
        shell: bash
        run: |
          echo "### AgentForge CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner OS**: \`${{ matrix.os }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Node Version**: \`${{ matrix.node-version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Exact Tested Commit**: \`$(git rev-parse HEAD)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Event**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Full runtime evidence required**: \`${{ needs.classify.outputs.package_required }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Result**: \`${{ job.status }}\`" >> $GITHUB_STEP_SUMMARY

  validate-windows:
    name: Validate (windows-latest, Node 22.x)
    needs: [classify, windows-test-shards]
    if: always()
    runs-on: windows-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify aggregate source identity
        shell: bash
        run: |
          EXPECTED_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Require complete Windows suite
        env:
          CI_CLASSIFY_RESULT: ${{ needs.classify.result }}
          CI_PACKAGE_REQUIRED: ${{ needs.classify.outputs.package_required }}
          CI_WINDOWS_SHARDS_RESULT: ${{ needs.windows-test-shards.result }}
        run: node scripts/ci-windows-test-gate.cjs

      - name: Setup Node.js 22.x
        if: needs.classify.outputs.package_required == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        if: needs.classify.outputs.package_required == 'true'
        run: npm ci

      - name: Build application
        if: needs.classify.outputs.package_required == 'true'
        run: npm run build

      - name: Validate PR diff hygiene
        if: github.event_name == 'pull_request'
        shell: bash
        run: git diff --check ${{ github.event.pull_request.base.sha }}...HEAD

      - name: Write Windows aggregate summary
        if: always()
        shell: bash
        run: |
          echo "### Required Windows validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Complete shard matrix: ${{ needs.windows-test-shards.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build and aggregate result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  package-windows:
    name: Package Windows (windows-latest, Node 22.x)
    needs: [classify, validate, validate-windows]
    if: always()
    runs-on: windows-latest
    steps:
      - name: Require upstream gates
        shell: bash
        run: |
          test '${{ needs.classify.result }}' = 'success'
          test '${{ needs.validate.result }}' = 'success'
          test '${{ needs.validate-windows.result }}' = 'success'
          test '${{ needs.classify.outputs.package_required }}' = 'true' -o '${{ needs.classify.outputs.package_required }}' = 'false'

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Show and verify build identity
        shell: bash
        run: |
          echo "=== CI Package Build Identity ==="
          echo "Event Name: ${{ github.event_name }}"
          echo "Git Reference: ${{ github.ref }}"
          EXPECTED_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Expected Source SHA: $EXPECTED_SHA"
          echo "Actual Tested SHA:   $ACTUAL_SHA"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: Exact-head identity mismatch. Expected $EXPECTED_SHA but got $ACTUAL_SHA"
            exit 1
          fi
          echo "Working Tree Status:"
          git status --short

      - name: Setup Node.js 22.x
        if: needs.classify.outputs.package_required == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        if: needs.classify.outputs.package_required == 'true'
        run: npm ci

      - name: Generate Windows NSIS installer and unpacked package
        if: needs.classify.outputs.package_required == 'true'
        run: npm run package:win

      - name: Verify generated relative asset base
        if: needs.classify.outputs.package_required == 'true'
        shell: pwsh
        run: |
          $html = Get-Content -Path "dist\index.html" -Raw
          if ($html -match 'src="/assets/' -or $html -match 'href="/assets/') {
            Write-Error "dist\index.html contains root-absolute asset paths (/assets/). Must use relative paths."
            exit 1
          }
          Write-Host "dist\index.html relative asset path check: PASS"

      - name: Run packaged process runtime smoke
        if: needs.classify.outputs.package_required == 'true'
        shell: pwsh
        run: |
          npm run smoke:packaged:win -- -Headless

      - name: Run real Windows installed application update integration test
        if: needs.classify.outputs.package_required == 'true'
        shell: pwsh
        run: |
          npm run test:installed:win -- -Headless

      - name: Run real production installed application smoke
        if: needs.classify.outputs.package_required == 'true'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/smoke-installed-production-win.ps1 -Headless

      - name: Run Windows Release Candidate verification gate
        if: needs.classify.outputs.package_required == 'true'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/verify-demo-rc-win.ps1

      - name: Upload Windows Installed Update Test Diagnostics
        if: always() && needs.classify.outputs.package_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentforge-installed-update-diagnostics-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: release/installed-update-test/diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify installer and generate metadata
        if: needs.classify.outputs.package_required == 'true'
        shell: pwsh
        run: |
          $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
          $ver = $pkg.version.Trim()
          $installerPath = "release\AgentForge Setup $ver.exe"
          if (-not (Test-Path $installerPath)) {
            $installerPath = "release\AgentForge-Setup-$ver.exe"
          }
          if (-not (Test-Path $installerPath)) {
            Write-Error "Installer executable not found at $installerPath"
            exit 1
          }

          $installerFilename = Split-Path -Leaf $installerPath
          $hash = (Get-FileHash -Path $installerPath -Algorithm SHA256).Hash
          $size = (Get-Item $installerPath).Length
          $sha = (git rev-parse HEAD).Trim()
          $sig = Get-AuthenticodeSignature -FilePath $installerPath
          $sigStatus = $sig.Status.ToString()
          $codeSigned = if ($sig.Status -eq "Valid") { "YES" } else { "NO" }

          Write-Host "=== Windows Installer Verification ==="
          Write-Host "Installer: $installerPath"
          Write-Host "Size: $size bytes"
          Write-Host "SHA256: $hash"
          Write-Host "Authenticode Status: $sigStatus"
          Write-Host "Code Signed: $codeSigned"
          Write-Host "Source SHA: $sha"

          $metadataContent = @"
          SOURCE_SHA=$sha
          INSTALLER_FILENAME=$installerFilename
          INSTALLER_SIZE_BYTES=$size
          INSTALLER_SHA256=$hash
          AUTHENTICODE_STATUS=$sigStatus
          CODE_SIGNED=$codeSigned
          BUILD_OS=windows-latest
          APP_VERSION=$ver
          "@

          Set-Content -Path "release\installer-metadata.txt" -Value $metadataContent

      - name: Upload Windows Installer Artifact
        if: needs.classify.outputs.package_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentforge-windows-installer-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            release/AgentForge*.exe
            release/installer-metadata.txt
            release/demo-rc-receipt.txt
          if-no-files-found: error
          retention-days: 7

      - name: Write Packaging Step Summary
        if: always()
        shell: bash
        run: |
          echo "### AgentForge Windows Packaging Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Exact Tested Commit**: \`$(git rev-parse HEAD)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Full runtime evidence required**: \`${{ needs.classify.outputs.package_required }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Packaging Status**: \`${{ job.status }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -f "release/installer-metadata.txt" ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat release/installer-metadata.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
