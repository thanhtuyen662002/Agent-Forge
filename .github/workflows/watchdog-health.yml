name: AgentForge Watchdog Health

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: agentforge-watchdog-health
  cancel-in-progress: true

# This workflow only reads GitHub state and publishes a report artifact.
# It never writes Issues, pull requests, branches, labels, or releases.
permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  statuses: read
  actions: read

jobs:
  report:
    name: Read-only queue health report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted report source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 22.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.x'

      - name: Collect read-only GitHub snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/watchdog-health-report.cjs --collect --repo "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/watchdog-snapshot.json"

      - name: Render health report and workflow summary
        run: |
          node scripts/watchdog-health-report.cjs \
            --input "$RUNNER_TEMP/watchdog-snapshot.json" \
            --report "$RUNNER_TEMP/watchdog-report.md"
          cat "$RUNNER_TEMP/watchdog-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload watchdog report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentforge-watchdog-report-${{ github.run_id }}
          path: ${{ runner.temp }}/watchdog-report.md
          if-no-files-found: ignore
          retention-days: 7
